<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cuTile Python Documentation</title>
  <noscript>
    <meta http-equiv="refresh" content="0; url=en/index.html" />
  </noscript>
  <script>
    (() => {
      const supported = ["en", "zh_CN"];
      let target = null;
      try {
        const saved = localStorage.getItem("cutile-docs-lang");
        if (saved && supported.includes(saved)) {
          target = saved;
        }
      } catch {
        // Ignore storage errors
      }
      if (!target) {
        const navLang = (navigator.language || "").toLowerCase();
        target = navLang.startsWith("zh") ? "zh_CN" : "en";
      }
      window.location.replace(target + "/index.html");
    })();
  </script>
</head>
<body>
  <p>Redirecting to documentation… Choose a language:</p>
  <ul>
    <li><a href="en/index.html">English</a></li>
    <li><a href="zh_CN/index.html">简体中文</a></li>
  </ul>
</body>
</html>
